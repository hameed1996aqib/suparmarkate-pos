name: Build Muhaseb Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  quality-gates:
    name: Production Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: supermarket_test
          POSTGRES_PASSWORD: supermarket_test
          POSTGRES_DB: supermarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supermarket_test -d supermarket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://supermarket_test:supermarket_test@127.0.0.1:5432/supermarket_test
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_ENABLED: "true"
      JWT_SECRET: test-only-github-actions-secret
      NODE_ENV: test
      BACKUP_SCHEDULE_ENABLED: "false"
      BACKUP_DIR: /tmp/muhaseb-backup-integration
      UPLOAD_DIR: /tmp/muhaseb-upload-integration
      SERVER_CONFIG_PATH: /tmp/muhaseb-server-config-test.json
      BACKUP_UPLOADS_ENABLED: "true"
      RUN_BACKUP_INTEGRATION: "true"
      PG_DOCKER_FALLBACK: "false"
      STOCK_RECONCILIATION_ENABLED: "false"
      JOB_WORKER_ENABLED: "false"
      PERMISSION_ENFORCEMENT_MODE: "enforce"
      ALLOW_LEGACY_PUBLIC_RECEIPTS: "false"
      ALLOW_LEGACY_PUBLIC_ATTENDANCE_SCAN: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Validate Prisma schema
        run: npm --workspace @supermarket/api run prisma -- validate

      - name: Deploy migrations to isolated database
        run: npm run prisma:deploy

      - name: Seed isolated database
        run: npm --workspace @supermarket/api run seed

      - name: Run unit tests
        run: npm run test:unit

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          pg_dump --version
          pg_restore --version

      - name: Run database integration tests
        run: npm run test:integration

      - name: Run integrity baseline
        run: npm run integrity:audit -- --label ci --output ../../artifacts/release-gates/ci-integrity.json

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build API and Web
        run: npm run build

      - name: Validate Android Expo bundle
        working-directory: apps/mobile-scanner
        run: npx expo export --platform android --output-dir ../../artifacts/mobile-export

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Web smoke tests
        run: npm run test:web

      - name: Create release manifest
        run: npm run release:manifest -- --phase ci --output ../../artifacts/release-gates/ci-manifest.json

      - name: Upload quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Muhaseb-Quality-Gates
          path: |
            artifacts/release-gates/*.json
            playwright-report/**
            test-results/**
          if-no-files-found: warn

  desktop-windows:
    name: Desktop Windows Installer
    runs-on: windows-latest
    needs: quality-gates
    env:
      DATABASE_URL: postgresql://supermarket:supermarket_password@localhost:5432/supermarket_db
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
            throw "WINDOWS_CSC_LINK and WINDOWS_CSC_KEY_PASSWORD secrets are required for a signed release."
          }

      - name: Set Desktop version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          npm pkg set "version=$version"

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Typecheck API
        run: npm run typecheck:api

      - name: Typecheck Desktop
        run: npm --workspace @supermarket/desktop run typecheck

      - name: Run Electron smoke test
        run: npm run test:electron

      - name: Build Windows installer
        run: npm run dist:desktop:win

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: Muhaseb-Windows-Installer-${{ github.ref_name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  mobile-android:
    name: Mobile Android APK
    runs-on: ubuntu-latest
    needs: quality-gates
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require Expo access token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is required to build the APK." >&2
            exit 1
          fi

      - name: Build APK on EAS
        working-directory: apps/mobile-scanner
        run: npx eas-cli@21.0.2 build --platform android --profile preview --non-interactive --wait --json > eas-build.json

      - name: Resolve APK download URL
        id: eas
        working-directory: apps/mobile-scanner
        run: |
          node -e 'const fs=require("fs"); const parsed=JSON.parse(fs.readFileSync("eas-build.json","utf8")); const build=Array.isArray(parsed)?parsed[0]:parsed; const url=build?.artifacts?.buildUrl; if(!url) throw new Error("EAS APK URL was not returned"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);'

      - name: Download APK
        run: curl --fail --location "${{ steps.eas.outputs.url }}" --output "Muhaseb-${{ github.ref_name }}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Muhaseb-Android-${{ github.ref_name }}
          path: Muhaseb-${{ github.ref_name }}.apk
          if-no-files-found: error

  server-docker-bundle:
    name: Server Docker Bundle
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build --label "org.opencontainers.image.version=${{ github.ref_name }}" -t muhaseb-api:local -f apps/api/Dockerfile .

      - name: Create server bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle="release-server/Muhaseb-Server-Docker"
          mkdir -p "$bundle/apps/api"

          cp docker-compose.yml "$bundle/"
          cp .dockerignore "$bundle/"
          cp .env.docker.example "$bundle/"
          printf '%s\n' "${{ github.ref_name }}" > "$bundle/release-tag.txt"
          docker save muhaseb-api:local -o "$bundle/muhaseb-api-local.tar"

          cp apps/api/Dockerfile "$bundle/apps/api/"
          cp apps/api/package.json "$bundle/apps/api/"
          cp apps/api/tsconfig.json "$bundle/apps/api/"
          cp -r apps/api/src "$bundle/apps/api/src"
          cp -r apps/api/prisma "$bundle/apps/api/prisma"

          cp -r scripts "$bundle/scripts"
          cp docs/docker-server-setup.md "$bundle/docker-server-setup.md"

          (cd release-server && zip -r Muhaseb-Server-Docker.zip Muhaseb-Server-Docker)

      - name: Upload server Docker bundle
        uses: actions/upload-artifact@v4
        with:
          name: Muhaseb-Server-Docker
          path: release-server/Muhaseb-Server-Docker.zip
          if-no-files-found: error
