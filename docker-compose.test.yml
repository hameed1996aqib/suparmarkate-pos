name: muhaseb-test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: muhaseb_postgres_test
    environment:
      POSTGRES_USER: supermarket_test
      POSTGRES_PASSWORD: supermarket_test
      POSTGRES_DB: supermarket_test
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - muhaseb_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermarket_test -d supermarket_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    container_name: muhaseb_redis_test
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  muhaseb_postgres_test_data:
